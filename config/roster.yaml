# The firm's agent roster — who runs, when, and on what (Phase 3, ADR-0030).
#
# Until now the run order was a tuple in `deep_dive.py` (`PHASE2_AGENTS`). Adding an agent meant editing
# Python, which puts sequencing decisions in the least reviewable place. Sequencing is a *policy*, so it
# belongs in config alongside every other threshold (CLAUDE.md: every hardcoded number lives in config).
#
# Fields
#   stage   SPEC §8 pipeline stage; agents run in stage order, then in listed order within a stage.
#   gate    the gate that must have PASSED before this agent runs. Gate B is the deterministic forensic
#           kill: nothing downstream of it should burn tokens on a company that already hard-failed.
#   phase   the build phase that introduces the agent (SPEC §11). The runner refuses agents above the
#           phase it was asked for, so the build order is enforced by code and not by memory.
#   requires  data prerequisites that GATE the agent. An agent whose inputs do not exist is SKIPPED WITH A
#           REASON and that reason reaches the report — never silently omitted. An absent agent and a clean
#           agent must never look alike (the same rule as ADR-0027's false-clean problem).
#   uses      inputs the agent READS but is not blocked on (ADR-0038). Both lists build the agent's
#           evidence brief; only `requires` can skip it. The separation exists because the two questions
#           are genuinely different: `management_analyst` cannot score promises without the concall
#           guidance, but it should still see the promoter-stake series — and gating it on shareholding
#           would silence the entire governance section over a secondary input.
#
#           THE BRIEF IS BUILT FROM THESE LISTS. `core/pipeline/briefs.py` has one evidence builder per
#           name below, so an input listed here is an input the agent actually receives, and an input
#           NOT listed is one it never sees. That is not bookkeeping: until ADR-0038 every agent received
#           an identical payload of financial ratios, so `transcript_analyst` was asked to trace guidance
#           drift across twelve quarters of concalls it had not been given.
#
# Prerequisite vocabulary, and what currently satisfies it:
#   financials      screener snapshot or an ingested annual report          — available
#   filing          an audited annual report walked this run                — available (ADR-0024)
#   segments        segment note from the filing                            — available, unparsed
#   peers           a peer set with comparable financials                   — NOT INGESTED
#   transcripts     concall transcripts                                     — NOT INGESTED
#   guidance        management guidance history                             — NOT INGESTED
#   shareholding    quarterly shareholding pattern                          — NOT INGESTED
#   pledge          promoter pledge disclosures                             — NOT INGESTED
#   prices          price/volume history                                    — NOT INGESTED

agents:
  # ---- Stage 3: sector and business ------------------------------------------------------------
  - name: sector_analyst
    stage: SECTOR_BUSINESS
    gate: B
    phase: 3
    requires: [financials, peers]
  - name: business_analyst
    stage: SECTOR_BUSINESS
    gate: B
    phase: 2
    requires: [financials]
  - name: macro_strategist
    stage: SECTOR_BUSINESS
    gate: B
    phase: 3
    requires: [financials]

  # ---- Stage 4: deep financials ----------------------------------------------------------------
  - name: financial_statement_analyst
    stage: DEEP_FINANCIALS
    gate: B
    phase: 2
    requires: [financials]
  - name: forensic_accountant
    stage: DEEP_FINANCIALS
    gate: B
    phase: 2
    requires: [financials]
  - name: unit_economics_analyst
    stage: DEEP_FINANCIALS
    gate: B
    phase: 3
    requires: [financials, segments]
    # `guidance`, not `transcripts`: management names the capacity — tonnes, plants, commissioning dates —
    # in its forward statements, and that is what a unit definition is built from. The full Q&A would add
    # 70KB of context to answer a question the promise ledger already answers.
    uses: [guidance]

  # ---- Stage 5: management and ownership -------------------------------------------------------
  # All three are blocked on ingestion that does not exist. They are listed anyway: a roster that hides
  # what it cannot do is how a report ends up silently missing its governance section.
  - name: management_analyst
    stage: MANAGEMENT_OWNERSHIP
    gate: C
    phase: 3
    # The promise ledger (`guidance`) is the distilled form of the transcripts and is what the scorecard
    # is built from; handing this agent the raw call structure as well duplicated ~70KB of the same
    # evidence in a different shape. Promoter stake and pledge are `uses`: the agent card lists `pledges`
    # among its inputs, and a governance read that cannot see promoter selling is not a governance read.
    requires: [financials, guidance]
    uses: [shareholding, pledge]
  - name: transcript_analyst
    stage: MANAGEMENT_OWNERSHIP
    gate: C
    phase: 3
    requires: [transcripts]
  - name: ownership_flows_analyst
    stage: MANAGEMENT_OWNERSHIP
    gate: C
    phase: 3
    requires: [shareholding, pledge]
    # Listed so the agent is TOLD it has no price history, rather than left to notice. Its mandate forbids
    # a concentration claim without a days-to-exit number, and an unstated absence is the one a model fills.
    uses: [prices]

  # ---- Stage 6-8: judgment tier (Phase 4 — listed so the roster is the whole firm) --------------
  - name: valuation_modeler
    stage: VALUATION
    gate: D
    phase: 4
    requires: [financials]
  - name: red_team
    stage: RED_TEAM
    gate: D
    phase: 4
    requires: [financials]
  - name: thesis_synthesizer
    stage: SYNTHESIS
    gate: E
    phase: 4
    requires: [financials]
  - name: portfolio_manager
    stage: SYNTHESIS
    gate: E
    phase: 4
    requires: [financials, prices]

  # ---- Stage 9: monitoring (Phase 5) -----------------------------------------------------------
  - name: post_mortem
    stage: MONITORING
    gate: E
    phase: 5
    requires: [financials]
