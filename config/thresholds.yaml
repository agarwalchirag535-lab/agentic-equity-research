# thresholds.yaml — EVERY hardcoded number lives here (SPEC §3, CLAUDE.md). Nowhere else.
# The compute layer takes these as explicit parameters; no policy number is baked into code.

multibagger:
  # §6.3 feasibility gate boundaries on required_reinvestment_rate = g_required / ROIC
  self_fund_ceiling: 1.0        # > 1.0  → cannot self-fund → must model dilution/leverage
  high_quality_ceiling: 0.6     # < 0.6  → self-funds with surplus → flag capital-allocation risk
  # §6.5 serial-dilution flag
  share_cagr_flag: 0.06         # share count CAGR (10y) above this without matching ROIC step-up

forensic:
  # SPEC §5 + ADR-0006. Single-value refs; PLAN OQ#3 may promote some to dated series.
  cfo_pat_min: 0.70             # single-year CFO/PAT below this = quality flag
  # A cumulative cash-conversion claim is a claim about a CYCLE. Below this many annual periods the
  # ratio is noise wearing a decade's authority: Symphony Ltd, a clean compounder, produced ΣCFO/ΣPAT
  # 0.56 over the two years readable from one filing and the screen returned SEVERE — a false positive
  # generated entirely by window length. Below the floor the metric is not derived and the check reports
  # UNAVAILABLE with the reason, which is what "insufficient history" should look like.
  cumulative_cfo_pat_min_periods: 3
  cumulative_cfo_pat_min: 0.70  # Σ CFO / Σ PAT over history below this = earnings not converting to cash
  beneish_m_threshold: -1.78    # M-score above this = elevated manipulation probability (NON-financials only)
  sloan_accrual_flag: 0.10      # |accruals / avg assets| above this = low earnings quality
  # ADR-0006 cash-reality checks
  cash_yield_floor_ratio: 0.40  # implied cash yield below 40% of risk-free = "is the cash real?" flag
  risk_free_rate: 0.065         # reference risk-free (India ~6.5%); PLAN OQ#3 may make this a dated series
  high_cost_debt_rate: 0.10     # borrowing cost above this WHILE holding large cash = paradox flag
  large_cash_to_assets: 0.15    # gross cash above this share of assets counts as "large"
  ageing_cwip_to_assets: 0.10   # CWIP above this share of assets, not commissioning, = siphoning flag
  ageing_cwip_years: 3          # years a CWIP block may age before it's a flag

# Lender-specific forensic checks (ADR-0002) — used when sector_class == FINANCIAL
financial_forensic:
  gnpa_drift_flag: 0.010        # YoY rise in GNPA ratio above this = flag
  provision_coverage_min: 0.50  # PCR below this = under-provisioned flag
  restructured_book_flag: 0.05  # restructured advances above this share of book = flag

# Originate-to-sell / lender earnings-quality checks (FORENSIC_METHODOLOGY §7 P7).
# Apply by BUSINESS MODEL (a company that originates & sells loans), not by sector label.
originate_to_sell:
  gain_on_sale_reliance_max: 1.0     # gain-on-loan-sale > 1.0x net income = profit rests on the sale channel (Carvana: 2.2x)
  provision_book_divergence_max: 0.50 # |provision growth − loan-book growth| above this = flag (Sezzle: +130% vs +6% ⇒ gap 1.24)
  reserve_suppression_min_drop: 0.010 # loan-loss provision RATE falling by ≥1.0 rate-point YoY = reserve-suppression tell (Sezzle: 3.5%→1.2%)
  held_for_sale_min_allowance: 0.005  # on-book loans carried with allowance < 0.5% of book while growing = no-reserve flag (Carvana)

# Exogenous-series divergence scanner (FORENSIC_METHODOLOGY §3 P1).
divergence:
  min_abs_correlation: 0.50           # only flag a WRONG-WAY metric↔driver relationship if it is at least moderately strong

# Universal SPEC §5 checks (ADAPTIVE_FORENSICS §4 step 1). PROVISIONAL until golden-set calibration.
universal_forensic:
  receivables_flow_gap: 0.25          # receivables growth − revenue growth above this = flag
  inventory_flow_gap: 0.30            # inventory growth − revenue growth above this = flag
  other_income_pbt_max: 0.25          # other income above this share of PBT = flag
  revenue_inflation_min_growth: 0.50  # trader tell: revenue growth at/above this ...
  revenue_inflation_max_margin: 0.03  # ... while gross margin at/below this = flag

# Model-specific checks (ADAPTIVE_FORENSICS §2 matrix). PROVISIONAL until golden-set calibration.
model_forensic:
  contract_asset_flow_gap: 0.30       # EPC: contract-asset growth − revenue growth above this = flag
  guarantees_to_net_worth_max: 0.50   # off-BS guarantees above this multiple of net worth = flag
  capitalised_cost_max_share: 0.30    # share of R&D/dev spend capitalised above this = flag
  adjusted_ebitda_gap_max: 0.05       # (adjusted − statutory) EBITDA above this share of revenue = flag
  promoter_loan_max_share: 0.10       # loans to promoters/KMP above this share of advances = flag

# Periods as first-class objects (ADR-0049). `FY{yy}` label arithmetic silently assumes a 31-March
# close; these tolerances decide when the filing's own stated closes prove the labels wrong.
periods:
  # |actual elapsed days - label years| above this → the dates win the CAGR exponent. March-to-March
  # windows differ from whole years by at most a couple of leap days; the smallest real year-end shift
  # is a quarter (~90 days). 45 sits between the two with a wide margin on both sides.
  label_span_tolerance_days: 45
  # Two companies' "same" period must close within this many days to be compared as one window.
  # Same-convention closers coincide to the day; the smallest year-end offset is ~30 days.
  peer_close_tolerance_days: 7

# Report assembly + publication policy (Phase 2, ADR-0021). Decides the verdict, promotes load-bearing
# claims, and dates the kill/rehabilitation criteria. Every number here is policy, never code.
report:
  # Feasibility target the published verdict is judged against (SPEC §6.3 gate inputs).
  target_return_multiple: 5
  target_years: 7
  # Kill / rehabilitation criteria (SPEC §7.1): dated, filing-resolvable, no LLM-authored numbers.
  criteria_horizon_years: 1       # resolve against the NEXT annual filing
  filing_lag_days: 210            # Indian AR lands within ~7 months of the 31-Mar FY close
  criteria_headroom: 0.10         # a kill threshold sits this far inside the current value (10% relative)
  # P(criterion holds) = confidence x prior + (1 - confidence)/2, where prior is this persistence rate
  # for a criterion its metric SATISFIES today and (1 - rate) for one it already violates. PROVISIONAL
  # until the golden set calibrates it; the first resolution (PC Jeweller, lesson 2) scored Brier 0.224
  # under the old broadcast-confidence rule and 0.149 under this one.
  criterion_persistence_prior: 0.80
  # Promotion of an agent claim to a report load-bearing point (grade A/B support is also required — R1).
  load_bearing_min_confidence: 0.60
  load_bearing_max_points: 3
  # Disclosure sufficiency: how much of the applicable playbook may be UNAVAILABLE before the honest
  # verdict is INSUFFICIENT_DISCLOSURE rather than a thesis (owner directive 2 — missing data is a signal).
  max_unavailable_share: 0.34
  # Line-by-line honesty (ADR-0017): share of enumerated notes that must carry a SUBSTANTIVE disposition
  # (clean/flag, not 'unknown'). 100% coverage with 100% 'unknown' is not reading the notes.
  min_note_review_share: 0.50
  # A fired flag at or above this severity makes the verdict FORENSIC_CAUTION (2=MEDIUM, 3=HIGH, 4=SEVERE).
  caution_min_severity: 3
  # --- publication gates (core/validators/publication.py) ---------------------------------------
  # Were module constants in Python until 2026-07-30, which CLAUDE.md forbids ("every hardcoded number
  # lives in config/thresholds.yaml. Nowhere else.").
  min_kill_criteria: 3
  min_rehabilitation_criteria: 1
  # --- line-by-line interrogation (ADR-0022) ----------------------------------------------------
  # How many HIGH-severity line-item questions may remain unanswered before the honest verdict is
  # INSUFFICIENT_DISCLOSURE rather than a thesis. Zero is deliberate and follows from the firm's own
  # premise: a company whose revenue cannot be decomposed into volume and price, whose buyer
  # concentration is unknown and whose related-party flows are unread has not been researched, however
  # clean its ratios look. On a screener snapshot alone nothing should ever reach COMPOUNDER.
  max_unanswered_high_line_items: 0

# Cross-document reconciliation (ADR-0024): a later annual report's comparative column restates the prior
# year, so consecutive filings overlap by one year and must agree. Classifying the disagreement matters:
# reprinting at a different rounding is noise, a real restatement is a finding, and a huge gap is our own
# extraction error. All PROVISIONAL until the Phase-6 golden set.
# Input plausibility for the DETERMINISTIC checks (ADR-0025). ADR-0022 gave the narration layer a
# `plausible:` guard that refuses to describe a degenerate ratio; the check layer had no equivalent, so it
# fired a FORENSIC_CAUTION on ALKYLAMINE off an implied cost of debt of 100% -- Interest Rs 1cr / Borrowings
# Rs 1cr, two ROUNDED screener figures whose ratio carries no information. A check may not accuse a company
# on an input that means nothing.
check_inputs:
  # A cost-of-debt ratio is only informative when the borrowings are material. Below this share of total
  # assets the year-end balance is noise and the implied rate is an artefact of rounding.
  min_debt_to_assets: 0.02
  # Ratios that are arithmetically impossible indicate a unit or extraction fault, never a finding. Cash
  # cannot exceed total assets; a value above this fails loudly instead of flagging the company.
  max_cash_to_assets: 1.0

reconciliation:
  rounding_abs_cr: 0.01      # <= Rs 1 lakh apart: the two documents rounded differently, not a restatement
  # Rounding is ABSOLUTE, tied to the precision the filings print (2dp in lakh). A relative band was tried
  # at 5bp and was wrong in both directions: on FY23 revenue 5bp is Rs 0.84cr, so a Rs 0.72cr revenue
  # reclassification was excused as "rounding" while an identical Rs 0.81cr one on the smaller FY22 base was
  # flagged as a restatement. Same phenomenon, opposite verdicts, decided by the size of the denominator.
  rounding_rel: 0.0
  extraction_error_rel: 0.25 # >25% apart is not a restatement, it is a misread row — quarantine, never use

screen:
  # SPEC §1 universe band and §8 Gate A liquidity/history floors
  mcap_min_cr: 300
  mcap_max_cr: 30000
  min_history_years: 5          # below this → INSUFFICIENT_HISTORY, separate pipeline
  adv_floor_cr: 1.0             # min average daily traded value (₹cr) — liquidity floor
