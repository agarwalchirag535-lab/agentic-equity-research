# reference_rates.yaml — dated market reference series (GOLDEN_SET.md §1 prerequisite, ADR-0078).
#
# WHY THIS FILE EXISTS. `thresholds.forensic.risk_free_rate` was ONE constant, 6.5%, applied to every
# vintage. The cash-reality check asks "is the yield this company earned on its cash plausible?", and
# that question has a different answer in every rate environment: Indian short rates ranged roughly
# 3.5% to 7.5% across the golden set's 2015-2021 window. A flat 6.5% floor makes a FY21 company earning
# a perfectly ordinary 3.5% look like it is hiding something, and lets a FY15 company earning 4% pass.
#
# THAT IS EXACTLY THE FAILURE GOLDEN_SET.md §1 WARNS ABOUT: "a bug uniform across the calibration set is
# indistinguishable from a property of the world." Calibrating thresholds against a mis-dated rate would
# teach the firm a compensating error and bake it in.
#
# THE RULE FOR ADDING A RATE. Every entry carries the SOURCE it was read from and the date it refers to,
# exactly like a fact in the store. A rate typed in from memory is a fabricated primary input, and it
# would silently miscalibrate every cash-reality verdict that used it — the worst failure mode this
# repo has, because nothing downstream can detect it. Add rows only from a citable published series
# (RBI's Weighted Average Call Rate or the 91-day T-bill / 10-year G-sec yield, as the reader prefers,
# stated here so the choice is visible and arguable).
#
# UNTIL ROWS EXIST the firm uses `fallback` and SAYS SO in every check that used it. A silent fallback
# would be the same defect wearing a config file.

risk_free_rate:
  fallback: 0.065
  fallback_basis: >-
    undated 6.5% reference, carried over from thresholds.forensic.risk_free_rate. NOT vintage-correct:
    it is the flat constant this file exists to replace, and any check resting on it says so.
  # ---------------------------------------------------------------------------------------------
  # HOW TO FILL THIS IN (ADR-0082). Six rows, and the golden set needs exactly these six — run
  # `python -m firm rates` to re-derive the list and to validate whatever you enter.
  #
  # SOURCE, decided and stated so the choice is arguable rather than implicit:
  #   RBI, Handbook of Statistics on the Indian Economy — Table 59, "Structure of Interest Rates",
  #   row "91-day Treasury Bill (Primary) Yield", financial-year average.
  #   Landing page: https://www.rbi.org.in/Scripts/AnnualPublications.aspx?head=Handbook+of+Statistics+on+Indian+Economy
  #
  # WHY THE 91-DAY BILL. The check this feeds asks whether the yield a company earned ON ITS CASH is
  # plausible. Cash sits in current accounts and short deposits, so the comparable is a short
  # sovereign rate — not the 10-year G-sec, which prices duration the company is not taking.
  #
  # WHY THESE ARE NOT ALREADY FILLED IN: RBI serves the Handbook behind a CAPTCHA and its bulletin
  # behind bot protection, so the historical series could not be fetched programmatically on
  # 2026-09-01. They were NOT typed from memory. A rate invented here would miscalibrate every
  # cash-reality verdict downstream and nothing in the system could detect it — the one failure mode
  # this repo has no defence against.
  #
  # RATES ARE DECIMALS: 6.5% is 0.065. `firm rates` rejects anything outside 0.5%-20% precisely to
  # catch a misplaced point, because 6.5 would set the cash-yield floor to 260% and flag every
  # company on earth.
  #
  #   FY18: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2017-18 average", as_of: "2018-03-31" }
  #   FY19: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2018-19 average", as_of: "2019-03-31" }
  #   FY21: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2020-21 average", as_of: "2021-03-31" }
  #   FY22: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2021-22 average", as_of: "2022-03-31" }
  #   FY23: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2022-23 average", as_of: "2023-03-31" }
  #   FY26: { rate: 0.0__, source: "RBI Handbook of Statistics, Table 59, 91-day T-bill (primary) yield, FY2025-26 average", as_of: "2026-03-31" }
  # ---------------------------------------------------------------------------------------------
  by_fiscal_year: {}
