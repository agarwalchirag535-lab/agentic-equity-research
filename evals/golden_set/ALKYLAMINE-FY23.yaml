# CAL-1 (docs/GOLDEN_SET.md §6). THIS CASE IS EXPECTED TO FAIL TODAY, AND THAT IS WHY IT IS HERE.
#
# The same company that comes out PASS in FY26 comes out HARD_FAIL when replayed at FY23, on
# cash_interest_inconsistent firing SEVERE at an implied cash yield of 2.55% against a 2.60% floor —
# 39.2% of risk-free against a band set at 40%. FY23 was a demand and margin downturn: no restatement, no
# auditor change, no regulatory action, and the company is still solvent and self-funded three years on.
#
# The expectation is written from that record, NOT from what the system currently outputs. Recording a
# failing expectation is the point of a golden set: it converts an argument about a threshold into a
# regression that either closes or stays visible. Nobody should move cash_yield_floor_ratio until this
# case, and negatives like it, say what the right value is.
