known_failure: >-
  PORT-1b (ADR-0058) — Five-Star's FY25/FY26 verified readings are not yet authored, so the staging
  series is unread and the screen honestly refuses (INSUFFICIENT). Behind that sits the case's real
  question: a provision-coverage floor calibrated on microfinance applied to a secured lender
  (hard_model_mismatch) — expected to remain a recorded calibration question even once the facts read.

# HARD IN TWO WAYS AT ONCE. The book is 99.98% secured, so an unsecured-book provision floor reads its
# collateral as under-provisioning (ADR-0058); and its asset quality genuinely deteriorated, so the case
# also pins that a real deterioration must REVIEW rather than be excused. Together they were a HARD_FAIL.
