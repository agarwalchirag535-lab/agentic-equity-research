expectation:
  screen_at_worst: REVIEW
  screen_at_best: REVIEW
  must_flag: [gnpa_drift]
  must_not_flag: [provision_coverage_low]
  rationale: >-
    Gross Stage 3 rose 1.79% to 3.37% — the company states both figures itself — so gnpa_drift is a real
    finding and must fire. provision_coverage_low must NOT: 41.4% coverage on a book 99.98% secured on
    tangible assets is collateral doing the work, and no lender discloses the value of security held
    against stage-3 loans, so the number that would matter cannot be computed at all.
