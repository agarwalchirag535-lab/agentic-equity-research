# Signed off 2026-09-01 after independent verification against the primary documents —
# every figure re-read from its cited page, sums recomputed, events read from the BSE
# filings, silence searched point-in-time. Performed by Claude on the owner's explicit
# instruction (ADR-0087), never using the firm's own output as evidence.
human_signed_off: true
lead_months: 12
label_event:
  kind: loan_default
  date: 2020-01-31
  # Verified against the BSE filing 2026-09-01: SEBI 30-days-continuing default disclosure by Gayatri
  # Projects Limited (scrip 532767), term loan from Syndicate Bank, default dated 31.12.2019, amount
  # Rs 1.37 cr (principal 0.60 + interest 0.77), disclosed 31.01.2020 — both dates after as_of.
  source: https://www.bseindia.com/xml-data/corpfiling/AttachHis/6d008b82-ee1a-40c3-8e95-f09c92e153a0.pdf
  summary: >-
    The company's own Regulation-30 disclosure of loan defaults continuing beyond 30 days: default
    date 31.12.2019 on working-capital term loans AND funded-interest term loans (an FITL is itself
    capitalised unpaid interest from an earlier restructuring) owed to a consortium of 12 banks led by
    Bank of Baroda, against Rs 1,845.05cr of bank borrowings and Rs 3,299.04cr total indebtedness. The
    letter states the amounts were first disclosed in the quarterly default disclosure of 2020-01-07.
    NOTE ON THE DATE: SEBI's default-disclosure regime (CIR/CFD/CMD1/44/2019) took effect 2020-01-01,
    so 2020-01-31 is the earliest a default COULD reach this register — it bounds the confession, not
    the distress. The enumeration was walked back to 2018-01-01 and found nothing earlier (the regime
    explains why), and the as_of precedes every default-regime disclosure that exists.

# WAVE 3: THE FIRST POSITIVE SELECTED FROM THE EXTENDED REGISTER (loan_default stream, ADR-0061) —
# and the first EPC/infrastructure contractor in the set. Selected by size rank within the stream's
# in-universe candidates, then de-censored per-scrip to the first default disclosure that exists.
#
# WHY THIS CASE IS HARD, AND WHAT IT IS FOR. The FY18 filing — the latest annual report readable at
# as_of — already carries the shape the default confessed twelve months later: receivable days at 142
# and rising (+50.2% receivables on +37.7% revenue), interest cover ~1.76x, claims receivable up 3x to
# Rs 205.97cr, Rs 713.81cr of advances to sub-contractors for works that had NOT COMMENCED — which the
# auditor's own Emphasis of Matter (p.56) calls "long pending for recovery" — and Rs 114cr of loans to
# subsidiaries and associates. And yet the UNIVERSAL check library is expected to read it as clean:
# the receivables/revenue gap (+12.5pp) sits under the 25pp limit, CFO/PAT reads 1.13 (propped by
# payables and contractee advances), and every check that would see the EPC-specific geometry —
# contract assets, unbilled work, capitalised advances, guarantees — is declared UNIMPLEMENTED
# (ADR-0051). A screen that PASSes this company is missing a capability, not finding a clean company.
