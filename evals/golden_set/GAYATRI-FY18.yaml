expectation:
  screen_at_worst: HARD_FAIL
  screen_at_best: REVIEW
  must_flag: []
  must_not_flag: []
  rationale: >-
    Twelve months before a confessed default to a 12-bank consortium — with the FY18 auditor already
    naming unrecovered advances for works that never commenced, receivable days at 142, interest cover
    of 1.76x and an FITL on the books from an earlier restructuring — the deterministic screen must not
    clear the company. REVIEW is the floor of honesty; PASS is a miss. No individual check is
    pre-registered in must_flag because, honestly, none of the wired checks measures the EPC geometry
    that carries the signal — which is the capability this case exists to force.

known_failure: >-
  CAP-EPC (ADR-0061) — two halves, both measured by the first cold run (2026-08-31). EXTRACTION: the
  walker registered the FY17 AR's statements and the FY18 AR's consolidated P&L, but the FY18 AR's
  balance sheet and cash-flow statement not at all — 5 of 6 verified facts unreproduced — so the
  screen judged FY18 on a store carrying no FY18 balance sheet; verified readings (ADR-0046 path) are
  the known fix. JUDGMENT: the screen landed REVIEW (in band) off inventory_divergent and
  other_income_heavy computed from the FY17-era rows — the right verdict for reasons that carry
  little of the real signal, because every check that measures the EPC geometry the FY18 filing
  confesses (advances for works never commenced, claims receivable, contract dues) is declared
  UNIMPLEMENTED (ADR-0051). Recorded as the register-selected forcing function for both.

# INTER-FILING RESTATEMENT QUANTIFIED (audit of 2026-09-01; the fact sources above already noted a
# "restated basis" — these are the figures): the FY17 AR's own standalone balance sheet (p.92) states
# FY17 trade receivables as 85,036.43 lakh; the FY18 AR's comparative column (p.61, the figure this
