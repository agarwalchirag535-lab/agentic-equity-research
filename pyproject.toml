[project]
name = "equity-firm"
version = "0.0.0"
description = "Agentic equity research firm — auditable multibagger discovery for Indian micro/small/mid-caps."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",          # CLI
    "polars>=1.0",          # silver/gold typed tables (parquet)
    "numpy>=1.26",
]

[project.optional-dependencies]
# LLM providers are optional so `core/compute` can be built and tested with zero network deps (Law 1).
llm = ["anthropic>=0.34", "openai>=1.40"]
india = ["certifi", "jugaad-data", "nsepython", "bse"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
firm = "firm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# Law 1 / Phase 1 acceptance: 100% coverage is REQUIRED on the compute layer only.
source = ["firm.core.compute"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set was implicitly "whatever this ruff version defaults to", which is how the repo woke up
# one day with 180 findings and a red `make lint` (ADR-0086). Defaults stay on; the ignores below are
# each an argued decision, not a mute button.
ignore = [
  # CLI "as of today" defaults. The operator's local date is the intent; point-in-time discipline is
  # enforced by the fact store's published_at filter (Law 3), never by the clock's timezone.
  "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# typer's documented API takes `typer.Option(...)` in parameter defaults; that is the framework's
# idiom, not a mutable-default bug.
"src/firm/cli.py" = ["B008"]
